---
- name: Clean up webserver and database setup
  hosts: all
  become: yes
  remote_user: ec2-user
  connection: ssh
  vars:
    webserver_package: apache2
    php_packages:
      - libapache2-mod-php8.2
      - php8.2
      - php8.2-cli
      - php8.2-common
      - php8.2-mysql
    db_packages:
      - mariadb-server
      - python3-pymysql
    db_name: ig2i-test
    db_user: ig2i
    ansible_ssh_private_key_file: /home/ec2-user/.ssh/vockey.pem

  tasks:
    - name: Stop Apache
      ansible.builtin.service:
        name: "{{ webserver_package }}"
        state: stopped

    - name: Remove PHP packages
      ansible.builtin.apt:
        name: "{{ php_packages }}"
        state: absent
        purge: yes

    - name: Remove Apache
      ansible.builtin.apt:
        name: "{{ webserver_package }}"
        state: absent
        purge: yes

    - name: Remove web root
      ansible.builtin.file:
        path: /var/www/html
        state: absent

    - name: Ensure PyMySQL is installed
      ansible.builtin.apt:
        name: python3-pymysql
        state: present

    - name: Drop application database (if server still exists)
      community.mysql.mysql_db:
        name: "{{ db_name }}"
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock
      ignore_errors: yes

    - name: Drop application database user (if server still exists)
      community.mysql.mysql_user:
        name: "{{ db_user }}"
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock
      ignore_errors: yes
    
    - name: Stop MariaDB
      ansible.builtin.service:
        name: mariadb
        state: stopped

    - name: Remove MariaDB
      ansible.builtin.apt:
        name: "{{ db_packages }}"
        state: absent
        purge: yes

    - name: Remove database files (optional)
      ansible.builtin.file:
        path: /var/lib/mysql
        state: absent

